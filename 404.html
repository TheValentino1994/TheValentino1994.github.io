<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <title>404 — Valentyn Kuchernoha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Inter:wdth,wght@75..125,100..900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #070707; --text-main: #edede8; --text-muted: #6B6B67; }
    html, body { width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
    body { cursor: none; }

    #cv  { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; }
    #cur { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

    .scanlines {
      position: fixed; inset: 0;
      background: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.025) 2px,rgba(0,0,0,.025) 4px);
      pointer-events: none; z-index: 2;
    }

    .ui {
      position: fixed; inset: 0; z-index: 5;
      display: flex; flex-direction: column;
      justify-content: flex-end;
      padding: 56px 64px;
      pointer-events: none;
    }

    .nav-link {
      position: relative;
      display: inline-flex; align-items: center; gap: 6px;
      font-family: 'Inter', sans-serif;
      font-variation-settings: 'wght' 300;
      font-size: 14px; line-height: 24px;
      color: var(--text-main);
      padding-bottom: 4px;
      text-decoration: none;
      pointer-events: all;
      transition: font-variation-settings .4s cubic-bezier(.16,1,.3,1);
      opacity: 0;
      animation: fadeup .8s .5s forwards;
    }
    .nav-link::after {
      content: ''; position: absolute; left: 0; bottom: 0;
      width: 24px; height: .5px; background: var(--text-main);
      transition: width .4s cubic-bezier(.16,1,.3,1);
    }
    .nav-link svg { width: 6px; height: 6px; margin-bottom: 8px; transition: transform .4s cubic-bezier(.16,1,.3,1); flex-shrink: 0; }
    .nav-link:hover { font-variation-settings: 'wght' 500; }
    .nav-link:hover::after { width: 100%; }
    .nav-link:hover svg { transform: translate(2px,-2px); }

    @keyframes fadeup { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

    @media (max-width: 1024px) {
      .ui { padding: 48px 32px; }
    }
    @media (max-width: 767px) {
      .ui { padding: 0 24px 40px; }
    }
  </style>
</head>
<body>

<canvas id="cv"></canvas>
<canvas id="cur"></canvas>
<div class="scanlines"></div>

<div class="ui">
  <a class="nav-link" href="index.html">
    Back home
    <svg viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 0.502686L11.4634 0.500122V11.6211" stroke="currentColor"/>
    </svg>
  </a>
</div>

<script>
(function(){
  var cv  = document.getElementById('cv');
  var cur = document.getElementById('cur');
  var bgCtx = cv.getContext('2d');
  var crCtx = cur.getContext('2d');
  var W, H, pts = [];
  var mx=-999,my=-999,pmx=-999,pmy=-999,lx=-999,ly=-999;
  var isMouse = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  function resize(){
    W = cv.width = cur.width = window.innerWidth;
    H = cv.height = cur.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', function(){ resize(); build(); });

  function getPixels(text, size, step){
    var tmp = document.createElement('canvas');
    tmp.width = W; tmp.height = Math.ceil(size * 1.7);
    var c = tmp.getContext('2d');
    c.fillStyle = '#fff';
    c.font = '800 ' + Math.round(size) + 'px "Syne"';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(text, W/2, tmp.height/2);
    var d = c.getImageData(0,0,W,tmp.height).data, out=[], s=step||5;
    for(var y=0;y<tmp.height;y+=s) for(var x=0;x<W;x+=s)
      if(d[(y*W+x)*4+3]>100) out.push({x:x,y:y});
    return {pts:out,w:W,h:tmp.height};
  }

  function build(){
    pts = [];
    var mob = W < 768, tab = W < 1024;

    // bigger 404 on desktop — more brutal
    var sz1 = mob ? Math.round(W*.32)  : tab ? Math.round(W*.24) : Math.round(W*.22);
    var sz2 = mob ? Math.round(W*.10)  : tab ? Math.round(W*.078): Math.round(W*.074);
    var sz3 = mob ? Math.round(W*.040) : tab ? Math.round(W*.033): Math.round(W*.031);
    var stp = mob ? 4 : 5;

    var r1 = getPixels('404',           sz1, stp);
    var r2 = getPixels("YOU'RE LOST.",  sz2, stp);
    var r3 = getPixels('page not found',sz3, stp+1);

    // vertical positions — slightly higher on mobile to leave room for button
    var cy1 = mob ? H*.28 : H*.30;
    var cy2 = mob ? H*.54 : H*.55;
    var cy3 = mob ? H*.68 : H*.70;

    function add(res,cy,col,sz){
      res.pts.forEach(function(p){
        var tx=p.x-res.w/2+W/2, ty=p.y-res.h/2+cy;
        var a=Math.random()*Math.PI*2, r=Math.random()*260+40;
        pts.push({x:W/2+Math.cos(a)*r,y:H/2+Math.sin(a)*r,tx:tx,ty:ty,vx:0,vy:0,col:col,size:sz});
      });
    }

    add(r1, cy1, 'rgba(237,237,232,1)',   mob?1.2:1.6);
    add(r2, cy2, 'rgba(237,237,232,.82)', mob?1.0:1.2);
    add(r3, cy3, 'rgba(107,107,103,.82)', mob?0.85:1.0);
  }

  if(isMouse){
    document.addEventListener('mousemove',function(e){
      pmx=mx; pmy=my; mx=e.clientX; my=e.clientY;
    });
    document.addEventListener('mouseleave',function(){ mx=-999; my=-999; });
  }

  function lerp(a,b,t){ return a+(b-a)*t; }

  function draw(){
    bgCtx.clearRect(0,0,W,H);
    crCtx.clearRect(0,0,W,H);

    lx=lerp(lx,mx,.12); ly=lerp(ly,my,.12);

    var spd = mx>0 ? Math.hypot(mx-pmx, my-pmy) : 0;
    var ndx = spd>0 ? (mx-pmx)/spd : 0;
    var ndy = spd>0 ? (my-pmy)/spd : 0;

    // ── Connections ──
    for(var i=0;i<pts.length;i+=5){
      for(var j=i+5;j<pts.length&&j<i+30;j+=5){
        var dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y, d=Math.sqrt(dx*dx+dy*dy);
        if(d<14){
          bgCtx.beginPath(); bgCtx.moveTo(pts[i].x,pts[i].y); bgCtx.lineTo(pts[j].x,pts[j].y);
          bgCtx.strokeStyle='rgba(237,237,232,'+((1-d/14)*.07)+')';
          bgCtx.lineWidth=.3; bgCtx.stroke();
        }
      }
    }

    // ── Particles — sand erosion physics ──
    for(var i=0;i<pts.length;i++){
      var p=pts[i];
      p.vx-=(p.x-p.tx)*.09;
      p.vy-=(p.y-p.ty)*.09;
      if(mx>0){
        var cx=p.x-mx, cy=p.y-my, d=Math.sqrt(cx*cx+cy*cy);
        if(d<120){
          // blast in movement direction + radial push
          var blast = spd*0.18*(1-d/120);
          p.vx += ndx*blast + cx/d*2.5*(1-d/120);
          p.vy += ndy*blast + cy/d*2.5*(1-d/120);
        }
      }
      p.vx*=.82; p.vy*=.82; p.x+=p.vx; p.y+=p.vy;

      var prox=mx>0?Math.max(0,1-Math.sqrt((p.x-mx)*(p.x-mx)+(p.y-my)*(p.y-my))/75):0;
      bgCtx.beginPath(); bgCtx.arc(p.x,p.y,p.size*(1+prox*.8),0,Math.PI*2);
      bgCtx.fillStyle=prox>.08?'rgba(237,237,232,'+(0.3+prox*.7)+')':p.col;
      bgCtx.fill();
    }

    // ── Cursor: expanding burst rings on movement ──
    if(isMouse && mx>0){
      if(spd>1.5){
        var rings=Math.min(Math.floor(spd*.25)+1,4);
        for(var r=0;r<rings;r++){
          var rr=6+r*10+spd*.4;
          crCtx.beginPath(); crCtx.arc(lx,ly,rr,0,Math.PI*2);
          crCtx.strokeStyle='rgba(237,237,232,'+(0.18-r*.04)+')';
          crCtx.lineWidth=.8; crCtx.stroke();
        }
      }
      // directional streak
      if(spd>3){
        crCtx.beginPath(); crCtx.moveTo(mx,my);
        crCtx.lineTo(mx-ndx*spd*1.2, my-ndy*spd*1.2);
        crCtx.strokeStyle='rgba(237,237,232,.12)';
        crCtx.lineWidth=1; crCtx.lineCap='round'; crCtx.stroke();
      }
      crCtx.beginPath(); crCtx.arc(mx,my,2.5,0,Math.PI*2);
      crCtx.fillStyle='rgba(237,237,232,.9)'; crCtx.fill();
      crCtx.beginPath(); crCtx.arc(mx,my,1.2,0,Math.PI*2);
      crCtx.fillStyle='#fff'; crCtx.fill();
    }

    requestAnimationFrame(draw);
  }

  document.fonts.load('800 48px "Syne"').then(function(){
    build(); draw();
  }).catch(function(){ build(); draw(); });
})();
</script>
</body>
</html>
