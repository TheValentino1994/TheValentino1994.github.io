<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#03030a;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 0 32px;font-family:'Inter',-apple-system,sans-serif;}
.orb1{position:fixed;width:350px;height:350px;border-radius:50%;background:radial-gradient(circle,rgba(29,158,117,0.08) 0%,transparent 70%);top:-10%;left:-5%;pointer-events:none;}
.orb2{position:fixed;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,0.06) 0%,transparent 70%);bottom:-5%;right:-5%;pointer-events:none;}
.carousel{position:relative;width:100%;height:380px;display:flex;align-items:center;justify-content:center;perspective:1200px;}
.phone{position:absolute;width:160px;height:320px;border-radius:28px;box-shadow:0 0 0 1px rgba(255,255,255,0.1),0 0 0 6px rgba(255,255,255,0.02),0 30px 80px rgba(0,0,0,0.9);overflow:hidden;cursor:pointer;transition:all 0.7s cubic-bezier(0.16,1,0.3,1);}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;pointer-events:none;}
.phone::before{content:'';position:absolute;inset:0;border-radius:28px;background:linear-gradient(130deg,rgba(255,255,255,0.06) 0%,transparent 50%);z-index:2;pointer-events:none;}
.notch{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:52px;height:14px;background:#000;border-radius:8px;z-index:10;}
.phone[data-pos="0"]{transform:translateX(-260px) scale(0.55) rotateY(18deg);opacity:0.2;z-index:1;}
.phone[data-pos="1"]{transform:translateX(-140px) scale(0.72) rotateY(10deg);opacity:0.5;z-index:2;}
.phone[data-pos="2"]{transform:translateX(0) scale(1) rotateY(0deg);opacity:1;z-index:5;box-shadow:0 0 0 1px rgba(255,255,255,0.12),0 0 0 7px rgba(255,255,255,0.03),0 40px 100px rgba(0,0,0,0.95),0 0 60px rgba(29,158,117,0.1);}
.phone[data-pos="3"]{transform:translateX(140px) scale(0.72) rotateY(-10deg);opacity:0.5;z-index:2;}
.phone[data-pos="4"]{transform:translateX(260px) scale(0.55) rotateY(-18deg);opacity:0.2;z-index:1;}
.phone[data-pos="hidden"]{opacity:0;pointer-events:none;z-index:0;}
.screen-label{margin-top:28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;}
.screen-name{font:700 15px/1 sans-serif;color:rgba(255,255,255,0.8);letter-spacing:-0.3px;transition:opacity .4s ease,transform .4s ease;}
.screen-desc{font:12px/1 sans-serif;color:rgba(255,255,255,0.25);}
.dots{display:flex;gap:8px;margin-top:20px;}
.dot{width:5px;height:5px;border-radius:2.5px;background:rgba(255,255,255,0.15);cursor:pointer;transition:all .4s cubic-bezier(.16,1,.3,1);}
.dot.on{width:22px;background:rgba(29,158,117,0.75);}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0.5px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20;transition:background .3s;color:rgba(255,255,255,0.4);font-size:18px;user-select:none;}
.nav:hover{background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.8);}
.nav-l{left:16px;}
.nav-r{right:16px;}
</style>
</head>
<body>
<div class="orb1"></div>
<div class="orb2"></div>
<div class="carousel">
  <div class="nav nav-l" id="navL">‹</div>
  <div class="nav nav-r" id="navR">›</div>
  <div class="phone" data-pos="0"><div class="notch"></div><img src="images/loop/mob-usp1.png"></div>
  <div class="phone" data-pos="1"><div class="notch"></div><img src="images/loop/mob-tasks.png"></div>
  <div class="phone" data-pos="2"><div class="notch"></div><img src="images/loop/mob-meetings.png"></div>
  <div class="phone" data-pos="3"><div class="notch"></div><img src="images/loop/mob-meeting-main.png"></div>
  <div class="phone" data-pos="4"><div class="notch"></div><img src="images/loop/mob-multiselect.png"></div>
</div>
<div class="screen-label">
  <div class="screen-name" id="sName">Meetings</div>
  <div class="screen-desc" id="sDesc">Calendar view with time-based schedule</div>
</div>
<div class="dots">
  <div class="dot" data-i="0"></div>
  <div class="dot" data-i="1"></div>
  <div class="dot on" data-i="2"></div>
  <div class="dot" data-i="3"></div>
  <div class="dot" data-i="4"></div>
</div>
<script>
const screens=[{name:'Welcome',desc:'All your platforms in one place'},{name:'Tasks',desc:'Priority tasks across integrations'},{name:'Meetings',desc:'Calendar view with schedule'},{name:'Meeting detail',desc:'Full context — files, attendees, links'},{name:'Multiselect',desc:'Bulk actions across items'}];
const phones=Array.from(document.querySelectorAll('.phone'));
const dots=Array.from(document.querySelectorAll('.dot'));
const N=phones.length;let center=2;
function posOf(i){let d=i-center;if(d<-2)d+=N;if(d>2)d-=N;return d+2;}
function update(){
  phones.forEach((p,i)=>{
    const pos=posOf(i);
    if(pos<0||pos>4){p.setAttribute('data-pos','hidden');}
    else{p.setAttribute('data-pos',pos);}
  });
  dots.forEach((d,i)=>d.classList.toggle('on',i===center));
  document.getElementById('sName').textContent=screens[center].name;
  document.getElementById('sDesc').textContent=screens[center].desc;
}
function go(d){center=(center+d+N)%N;update();resetTimer();}
phones.forEach((p,i)=>p.addEventListener('click',()=>{const pos=posOf(i);if(pos===1)go(-1);else if(pos===3)go(1);}));
dots.forEach(d=>d.addEventListener('click',()=>{center=+d.dataset.i;update();resetTimer();}));
document.getElementById('navL').addEventListener('click',()=>go(-1));
document.getElementById('navR').addEventListener('click',()=>go(1));
let timer;function resetTimer(){clearInterval(timer);timer=setInterval(()=>go(1),3500);}
resetTimer();update();
</script>
</body>
</html>
