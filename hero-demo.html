<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Demo - Process-Driven</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #020202;
            color: #edede8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 44px;
        }

        .container {
            width: 100%;
            max-width: 1440px;
            padding: 0 120px;
        }

        .label {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 14px;
            line-height: 20px;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #8a8a85;
            margin-bottom: 16px;
            opacity: 0;
            transform: translateY(-12px);
            animation: fadeInDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .questions {
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin-bottom: 80px;
        }

        .question {
            font-family: 'Bricolage Grotesque', sans-serif;
            font-weight: 700;
            font-size: 96px;
            line-height: 96px;
            letter-spacing: -4.5px;
            color: #edede8;
            cursor: default;
            transition: text-shadow 0.3s ease;
        }

        .question:hover {
            text-shadow: 0 0 40px rgba(237, 237, 232, 0.3);
        }

        #q1 { animation-delay: 0.1s; }
        #q2 { animation-delay: 1.2s; }
        #q3 { animation-delay: 2.3s; }

        .cta {
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 20px;
            line-height: 32px;
            color: #8a8a85;
            cursor: pointer;
            display: inline-block;
            opacity: 0;
            transform: translateY(16px);
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 3.5s forwards;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .cta:hover {
            color: #edede8;
            transform: translateY(20px);
        }

        .arrow {
            display: inline-block;
            animation: bounce 1.5s ease-in-out infinite;
        }

        .scroll-indicator {
            position: fixed;
            bottom: 60px;
            right: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            opacity: 0;
            animation: fadeIn 0.6s ease 4s forwards;
        }

        .scroll-line {
            position: relative;
            width: 1px;
            height: 64px;
            background: #2e2e2e;
        }

        .scroll-line::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 1px;
            height: 0;
            background: #edede8;
            animation: scrollPulse 2s ease-in-out infinite;
        }

        .scroll-text {
            transform: rotate(90deg);
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #edede8;
            opacity: 0.4;
        }

        .info {
            position: fixed;
            bottom: 40px;
            left: 44px;
            font-size: 12px;
            color: #8a8a85;
            opacity: 0;
            animation: fadeIn 1s ease 4s forwards;
        }

        @keyframes fadeInDown {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            to { opacity: 0.3; }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(3px); }
        }

        @keyframes scrollPulse {
            0%, 100% { height: 0; }
            50% { height: 100%; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        @media (max-width: 768px) {
            body {
                padding: 80px 20px 60px;
                align-items: flex-start;
            }

            .container {
                padding: 0;
            }

            .label {
                font-size: 12px;
            }

            .question {
                font-size: 40px;
                line-height: 44px;
                letter-spacing: -1.2px;
            }

            .questions {
                gap: 20px;
                margin-bottom: 40px;
            }

            .cta {
                font-size: 16px;
            }

            .scroll-indicator,
            .info {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="label">Product Designer</div>

        <div class="questions">
            <div class="question" id="q1">I start with "Why?"</div>
            <div class="question" id="q2">move to "What if?"</div>
            <div class="question" id="q3">end with "How now?"</div>
        </div>

        <div class="cta">
            See results <span class="arrow">↓</span>
        </div>
    </div>

    <div class="scroll-indicator">
        <div class="scroll-line"></div>
        <div class="scroll-text">Scroll</div>
    </div>

    <div class="info">Hero Demo • Process-Driven Approach</div>

    <script>
        // Scramble effect
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ?!.,';
        const keep = new Set([' ', '"', '?', "'"]);

        function scramble(element, text, delay, duration) {
            setTimeout(() => {
                const steps = Math.round(duration / 28);
                let step = 0;

                const interval = setInterval(() => {
                    const progress = step / steps;
                    let out = '';

                    for (let i = 0; i < text.length; i++) {
                        const ch = text[i];
                        if (keep.has(ch)) {
                            out += ch;
                            continue;
                        }
                        const boundary = (i / text.length) - 0.1 + Math.random() * 0.2;
                        out += progress > boundary
                            ? ch
                            : chars[Math.floor(Math.random() * chars.length)];
                    }

                    element.textContent = out;
                    step++;

                    if (step > steps) {
                        clearInterval(interval);
                        element.textContent = text;
                    }
                }, 28);
            }, delay);
        }

        // Apply scramble to each question
        const q1 = document.getElementById('q1');
        const q2 = document.getElementById('q2');
        const q3 = document.getElementById('q3');

        const text1 = q1.textContent;
        const text2 = q2.textContent;
        const text3 = q3.textContent;

        scramble(q1, text1, 100, 1100);
        scramble(q2, text2, 1200, 1100);
        scramble(q3, text3, 2300, 1100);

        // Pulse effect on CTA
        const cta = document.querySelector('.cta');
        setInterval(() => {
            cta.style.animation = 'pulse 2.5s ease-in-out infinite';
        }, 3500);
    </script>
</body>
</html>
